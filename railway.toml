[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build && npm run setup-folders"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"

[postgres]
name = "conexion360-db"
version = "15"

# Variables de entorno para Railway
[variables]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"